<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오</title>
<!-- 화면 그리기 전에 저장된 테마를 미리 적용해 깜빡임 방지 -->
<script>
document.documentElement.setAttribute('data-theme', localStorage.getItem('portfolio-theme') || 'light');
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <h1>My Portfolio</h1>
    <p class="subtitle">직접 만든 프로젝트 모음입니다</p>

    <!-- 테마 선택 스위처 -->
    <div class="theme-switcher" role="group" aria-label="테마 선택">
      <button class="theme-btn" data-theme="light" title="라이트">라이트</button>
      <button class="theme-btn" data-theme="dark" title="다크">다크</button>
      <button class="theme-btn" data-theme="ocean" title="오션">오션</button>
      <button class="theme-btn" data-theme="forest" title="포레스트">포레스트</button>
      <button class="theme-btn" data-theme="sunset" title="선셋">선셋</button>
    </div>
  </header>

  <!-- 프로젝트 카드 목록 -->
  <div class="card-grid">
    <div class="project-card" data-url="../todo/index.html">
      <div class="card-icon">📝</div>
      <h2>Todo App</h2>
      <p>할 일을 추가, 완료, 삭제할 수 있는 할 일 목록 앱</p>
      <span class="card-link">바로가기 →</span>
    </div>

    <div class="project-card" data-url="../exchangerate/index.html">
      <div class="card-icon">💱</div>
      <h2>환율 변환기</h2>
      <p>금액을 입력하면 원하는 통화로 환산해주는 변환기</p>
      <span class="card-link">바로가기 →</span>
    </div>

    <div class="project-card" data-url="../SnakeGame/index.html">
      <div class="card-icon">🐍</div>
      <h2>스네이크 게임</h2>
      <p>방향키로 조작하는 클래식 스네이크 게임</p>
      <span class="card-link">바로가기 →</span>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
