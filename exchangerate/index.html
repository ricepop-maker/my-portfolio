<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>환율 변환기</title>
<!-- 포트폴리오에서 선택한 테마를 화면 그리기 전에 적용 -->
<script>
document.documentElement.setAttribute('data-theme', localStorage.getItem('portfolio-theme') || 'light');
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>환율 변환기</h1>

  <div class="field">
    <label for="amount">금액</label>
    <input type="number" id="amount" placeholder="금액을 입력하세요" min="0">
  </div>

  <div class="field currency-row">
    <div class="currency-select">
      <label for="fromCurrency">From</label>
      <select id="fromCurrency">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="KRW" selected>KRW</option>
        <option value="JPY">JPY</option>
      </select>
    </div>

    <button type="button" id="swap-btn" class="swap-btn" aria-label="통화 교환">⇄</button>

    <div class="currency-select">
      <label for="toCurrency">To</label>
      <select id="toCurrency">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="KRW">KRW</option>
        <option value="JPY">JPY</option>
      </select>
    </div>
  </div>

  <button id="convertBtn">통화 변환</button>

  <div id="result" class="result"></div>
</div>

<script src="main.js"></script>
</body>
</html>
