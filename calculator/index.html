<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공학용 계산기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 계산기 카드 -->
<div class="calculator">
  <h1 class="title">공학용 계산기</h1>

  <!-- 입력 수식과 결과를 보여주는 디스플레이 -->
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <!-- 공학 함수 버튼 영역 -->
  <div class="pad sci-pad">
    <button class="btn func" data-func="sin">sin</button>
    <button class="btn func" data-func="cos">cos</button>
    <button class="btn func" data-func="tan">tan</button>
    <button class="btn func" data-func="ln">ln</button>
    <button class="btn func" data-func="log">log</button>

    <button class="btn func" data-func="asin">asin</button>
    <button class="btn func" data-func="acos">acos</button>
    <button class="btn func" data-func="atan">atan</button>
    <button class="btn postfix" data-value="²">x²</button>
    <button class="btn func" data-func="√">√</button>

    <button class="btn const" data-value="π">π</button>
    <button class="btn const" data-value="e">e</button>
    <button class="btn op" data-value="^">x^y</button>
    <button class="btn postfix" data-value="!">x!</button>
    <button id="degToggle" class="btn mode">DEG</button>

    <button class="btn paren" data-value="(">(</button>
    <button class="btn paren" data-value=")">)</button>
    <button class="btn postfix" data-value="%">%</button>
    <button id="backspace" class="btn action">⌫</button>
    <button id="clear" class="btn action">C</button>
  </div>

  <!-- 일반 숫자 키패드 영역 -->
  <div class="pad num-pad">
    <button class="btn num" data-value="7">7</button>
    <button class="btn num" data-value="8">8</button>
    <button class="btn num" data-value="9">9</button>
    <button class="btn op" data-value="/">÷</button>

    <button class="btn num" data-value="4">4</button>
    <button class="btn num" data-value="5">5</button>
    <button class="btn num" data-value="6">6</button>
    <button class="btn op" data-value="*">×</button>

    <button class="btn num" data-value="1">1</button>
    <button class="btn num" data-value="2">2</button>
    <button class="btn num" data-value="3">3</button>
    <button class="btn op" data-value="-">-</button>

    <button id="plusMinus" class="btn action">±</button>
    <button class="btn num" data-value="0">0</button>
    <button class="btn num" data-value=".">.</button>
    <button class="btn op" data-value="+">+</button>

    <button id="equals" class="btn equals">=</button>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
