<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자기소개</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 자기소개 카드 -->
<div class="card">
  <!-- 프로필 아바타 (이모지) -->
  <div class="avatar">🧑‍💻</div>
  <!-- 이름 -->
  <h1 class="name">홍길동</h1>
  <!-- 직업 -->
  <p class="job">프론트엔드 개발자</p>
  <!-- 취미 목록 -->
  <div class="hobby">
    <h2>취미</h2>
    <ul>
      <li>영화 감상</li>
      <li>코딩</li>
      <li>여행</li>
    </ul>
  </div>
</div>

<!-- 초기화 스크립트 -->
<script src="main.js"></script>
</body>
</html>
