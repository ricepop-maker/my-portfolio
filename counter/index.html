<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카운터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 카운터 카드 -->
<div class="card">
  <!-- 페이지 제목 -->
  <h1 class="title">카운터</h1>
  <!-- 현재 숫자를 표시하는 영역 -->
  <div class="count" id="count">0</div>

  <!-- 증가/감소/리셋 버튼 -->
  <div class="buttons">
    <button id="decreaseBtn" class="btn minus">-</button>
    <button id="resetBtn" class="btn reset">리셋</button>
    <button id="increaseBtn" class="btn plus">+</button>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
